# The maintenance page (Ralf, 2026-10-22): included at server level by researcher.conf and participant.conf, after
# they set $wartung_seite (forschende or teilnahme); nginx/servers.sh sets $wartung_name (the brand's name).
#  - Switch: the file /etc/nginx/wartung/<side>.an (~/askurious-status/wartung on the host, deploy/docker/wartung.sh)
#    makes every request of that side 503 with the page. restart.sh sets it for the researchers' side right before
#    their container restarts and removes it once it is healthy; wartung.sh removes it at its end time in any case.
#    Without the folder (an nginx from before) nginx sees no file: the side stays open.
#  - Failure: a container that does not answer (502: it restarts, it is down) shows the same page as 503, not nginx's
#    own "Bad Gateway". The app's own 503 (backup window) is not touched: nginx does not intercept upstream answers.
# Browsers get the HTML page, scripts (autosave, live polling, the API, the diary app) a line of text
# ($wartung_typ). Both with Retry-After. The page asks /healthz every 15 s, which stays 503 while the switch is on.
set $wartung_an "";
if (-f /etc/nginx/wartung/$wartung_seite.an) { set $wartung_an 1; }
# the page itself passes (an internal redirect runs the server's rewrites again)
if ($wartung_frei) { set $wartung_an ""; }
if ($wartung_an) { return 503; }
error_page 503 /_wartung/schalter;
error_page 502 =503 /_wartung/ausfall;
location ^~ /_wartung/ {
    internal;
    root /srv;                               # the pages are in the nginx image (nginx-image/wartung/)
    try_files /wartung/$wartung_seite.$wartung_sprache.$wartung_typ /wartung/$wartung_seite.de.$wartung_typ =503;
    charset utf-8;
    charset_types text/plain;  # text/html is in the list by default; naming it twice made nginx warn at every start
    sub_filter "__MARKE__" $wartung_name;
    sub_filter_once off;
    sub_filter_types text/plain;
    access_log off;
    # add_header here replaces the server's: the protective headers once more (askurious.conf.template, DP-13); the
    # page's own CSP stands in its meta tag (hashes of its style and script)
    add_header Retry-After $wartung_retry always;
    add_header Cache-Control "no-store" always;
    add_header Strict-Transport-Security $askurious_hsts always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    }
