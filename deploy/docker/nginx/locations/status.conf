# The status page (app/status_node.py): status.askurious.de and status.<brand> of each further brand (BRANDS).
# Included by each of their server blocks, which nginx/servers.sh writes, one per name with its own certificate.
client_max_body_size 1k;
access_log /var/log/nginx/access.log noaddress if=$failed;
location / { limit_except GET HEAD { deny all; } proxy_pass http://status; }
