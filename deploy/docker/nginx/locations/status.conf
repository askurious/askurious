# The status page (app/status_node.py): status.askurious.de and status.<brand> of each further brand (BRANDS).
# Included by each of their server blocks, which nginx/servers.sh writes, one per name with its own certificate.
client_max_body_size 1k;
access_log /var/log/nginx/access.log noaddress if=$failed;
limit_conn ask_conn 20;
# the state as JSON for the operators' monitoring: its address holds a token
location ^~ /status/ { limit_except GET HEAD { deny all; } limit_req zone=ask_secret burst=20 nodelay; access_log off; proxy_pass http://status; }
location / { limit_except GET HEAD { deny all; } limit_req zone=ask_pages burst=200 nodelay; proxy_pass http://status; }
