# The researchers' side: askurious.de and each further brand's own name (BRAND_RESEARCHER_HOSTS, e.g. polltergeist.de).
# Included by each of their server blocks, which nginx/servers.sh writes, one per name with its own certificate.
# Bodies as large as the app takes them, per path (audit 2026-10-13, DP-12): 10 MB for every form and piece of an
# upload (config.py MAX_CONTENT_LENGTH; videos and interview audio go up in pieces of 5 and 4 MB), more only where the
# app takes more. nginx keeps a body on its disk until the app answers: a larger limit everywhere let anyone put 45 MB
# there for any address.
client_max_body_size 11m;
access_log /var/log/nginx/access.log noaddress if=$failed;
# the maintenance page: switch forschende.an and the page when the container does not answer (wartung.conf)
set $wartung_seite forschende;
include /etc/nginx/locations/wartung.conf;
location ^~ /static/ {
    root /srv;
    try_files $versioned_static_file $uri =404;
    gzip on;
    gzip_static on;
    add_header Cache-Control $static_cache_policy always;
    add_header Strict-Transport-Security $askurious_hsts always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options $own_frame_options always;
    add_header Referrer-Policy no-referrer always;
    access_log off;
    # licence files of the vendored code have no extension (LICENSE, LICENSE_CORE_JS): plain text instead of
    # application/octet-stream, which nosniff makes a download (licence audit 2026-10-21, B-3; Flask does the same
    # without nginx, app/__init__.py LICENCE_FILE). Root, headers and gzip come from the location around it.
    location ~ /LICENSE[^/.]*$ {
        default_type text/plain;
        charset utf-8;
        }
    }
# Only the validated /media response may enter here; no public filesystem route.
location ^~ /_protected_media/ {
    internal;
    alias /app/instance/uploads/;
    # X-Accel internal redirects discard ordinary upstream headers: restore the app's policies explicitly.
    add_header Strict-Transport-Security $askurious_hsts always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options $media_frame_options always;
    add_header Referrer-Policy $media_referrer_policy always;
    add_header Content-Security-Policy $upstream_http_content_security_policy always;
    add_header Permissions-Policy $upstream_http_permissions_policy always;
    add_header Cross-Origin-Opener-Policy $upstream_http_cross_origin_opener_policy always;
    access_log off;
    }

# braked per address in front of the app (askurious.conf.template; security audit 2026-10-13, DP-3/AU-9): requests under
# way at once, the forms of the sign-in (POST only), and the addresses with a secret in them or behind them
limit_conn ask_conn 100;
location ~ ^/auth/(sign-in|sign-in/code|forgot-password)$ { limit_req zone=ask_signin burst=30 nodelay; proxy_pass http://$researcher_pool; }
# A failed mailbox proof must not put its bearer token into the URI access log.
location ~ ^/account/confirm-email/ { limit_req zone=ask_secret burst=100 nodelay; access_log off; proxy_pass http://$researcher_pool; }
location ~ ^/(privacy/delete|verify|auth/password|account/confirm-email|invite|join|api/v1)(/|$) { limit_req zone=ask_secret burst=100 nodelay; proxy_pass http://$researcher_pool; }
# the construct toolbox is open to visitors and costs a search per chosen facet (audit 2026-10-22, D-03)
location ^~ /constructs/ { limit_req zone=ask_search burst=100 nodelay; proxy_pass http://$researcher_pool; }
# a survey file with its images (IMPORT_MAX_BYTES 40 MB, app/transfer.py) and scanned paper questionnaires (40 MB,
# app/paper.py)
location = /surveys/new/import { client_max_body_size 45m; proxy_pass http://$researcher_pool; }
location ~ ^/surveys/[^/]+/paper/upload$ { client_max_body_size 45m; proxy_pass http://$researcher_pool; }
# What a Rechenknecht sends back (app/compute.py): the one of this server (service compute) calls the app directly
# (COMPUTE_CALLBACK http://researcher:8000/rechenknecht), never through nginx. From outside nobody may: headers with a
# fresh time and the form of a signature, set by anyone, made the app read up to 64 MB (Abgleich 2026-10-15, DP-12).
# An outside Rechenknecht on another machine would need the old line again: client_max_body_size 64m;
# proxy_request_buffering off; proxy_pass http://$researcher_pool;
location ^~ /rechenknecht/ { return 404; }
# The relay that cancels transcriptions when answers are erased (app/interview_transcribe.py) is for the app's own
# containers, which call researcher:8000 directly (WHISPER_CANCEL_URL); not from outside (Abgleich 2026-10-15, NB-9)
location ^~ /guide/internal/ { return 404; }
# The status container queries the app directly; public callers cannot trigger compute probes.
location = /healthz/compute { return 404; }
location = /healthz/whisper { return 404; }
location / { proxy_pass http://$researcher_pool; }
