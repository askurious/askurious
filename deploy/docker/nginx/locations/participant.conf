# The participants' side: ask.askurious.de and each further brand's (BRAND_PARTICIPANT_HOSTS, e.g. ask.polltergeist.de).
# Included by each of their server blocks, which nginx/servers.sh writes, one per name with its own certificate.
# a page of answers takes at most 2 MB (PARTICIPANT_FORM_BYTES, app/__init__.py), the same for the live vote, the
# pretest link and the diary app; only a questionnaire page (/s/) with voice messages more (audit 2026-10-13, DP-12)
client_max_body_size 3m;
# the maintenance page (wartung.conf): with two containers only when both do not answer, with one (a brand's own
# containers, a smaller installation) while it restarts; the switch teilnahme.an only by hand or for a new database
# image (restart.sh in the maintenance window), never in a deploy
set $wartung_seite teilnahme;
include /etc/nginx/locations/wartung.conf;
proxy_read_timeout 60s;
# a container that refuses the connection (stopped, restarting) or does not take it within 2 s: the same request
# goes to the other one at once. Not after it was sent (no non_idempotent): a page of answers is never stored
# twice. Only within the first 5 s: a slow GET that ran into proxy_read_timeout is not started a second time in
# the other container, which would only double the load (gunicorn's gthread workers do not end a slow request
# after --timeout; audit 2026-10-09, BT10).
proxy_connect_timeout 2s;
proxy_next_upstream error timeout;
proxy_next_upstream_timeout 5s;
proxy_next_upstream_tries 2;
access_log off;             # no log of the participants' requests (B2)
location ^~ /static/ {
    root /srv;
    try_files $versioned_static_file $uri =404;
    gzip on;
    gzip_static on;
    add_header Cache-Control $static_cache_policy always;
    add_header Strict-Transport-Security $askurious_hsts always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options $own_frame_options always;
    add_header Referrer-Policy no-referrer always;
    access_log off;
    # licence files of the vendored code have no extension (LICENSE, LICENSE_CORE_JS): plain text instead of
    # application/octet-stream, which nosniff makes a download (licence audit 2026-10-21, B-3; Flask does the same
    # without nginx, app/__init__.py LICENCE_FILE). Root, headers and gzip come from the location around it.
    location ~ /LICENSE[^/.]*$ {
        default_type text/plain;
        charset utf-8;
        }
    }
# Only the validated /media response may enter here; no public filesystem route.
location ^~ /_protected_media/ {
    internal;
    alias /app/instance/uploads/;
    # X-Accel internal redirects discard ordinary upstream headers: restore the app's policies explicitly.
    add_header Strict-Transport-Security $askurious_hsts always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options $media_frame_options always;
    add_header Referrer-Policy $media_referrer_policy always;
    add_header Content-Security-Policy $upstream_http_content_security_policy always;
    add_header Permissions-Policy $upstream_http_permissions_policy always;
    add_header Cross-Origin-Opener-Policy $upstream_http_cross_origin_opener_policy always;
    access_log off;
    }

# requests under way at once per address (ask_conn, askurious.conf.template; security audit 2026-10-13, TN-32)
limit_conn ask_conn 400;
# only what needs no sign-in (concept, E3): survey, pretest, public dashboards, quota links, the weather demo, and the
# join link of a diary study (/j/<code>, the address in its QR code); braked per address in front of the app (ask_pages)
# a questionnaire page with voice messages (items/voice.py) may be larger (DP-12); braked like the others (^~ wins
# over the regular expressions below, so it carries the brake itself)
location ^~ /s/ { client_max_body_size 25m; limit_req zone=ask_pages burst=2000 nodelay; proxy_pass http://$participant_pool; }
location ~ ^/(s|p|d|q|j|demo)(/|$) { limit_req zone=ask_pages burst=2000 nodelay; proxy_pass http://$participant_pool; }
# the live vote's phones (they ask every 2 s from one address in a lecture hall): wide brakes (ask_live, ask_live_post;
# audit 2026-10-15, NB-7), their finer limits are in the app
location ~ ^/live(/|$) { limit_req zone=ask_live burst=4000 nodelay; limit_req zone=ask_live_post burst=1500 nodelay; proxy_pass http://$participant_pool; }
# the interviewee's own device during an interview (app/interview_screen.py, experimental "Teilnehmerbildschirm"):
# it asks every 2 s like a live vote's phone, so the same wide brakes; the finer limits are in the app
location ~ ^/screen(/|$) { limit_req zone=ask_live burst=4000 nodelay; limit_req zone=ask_live_post burst=1500 nodelay; proxy_pass http://$participant_pool; }
# media and map data
location ~ ^/(media|geo|static)(/|$) { proxy_pass http://$participant_pool; }
# the diary app (app/diary_api.py): its API, and the Digital Asset Links that let the join link open the app. Only
# /api/diary/: the researchers' data API (/api/v1/, app/data_access.py) stays on the researchers' side
location ^~ /api/diary/ { limit_req zone=ask_pages burst=2000 nodelay; proxy_pass http://$participant_pool; }
location = /.well-known/assetlinks.json { proxy_pass http://$participant_pool; }
location = /healthz { proxy_pass http://$participant_pool; }
location = /healthz/compute { return 404; }
location = /healthz/whisper { return 404; }
# the app answers them on both sides (app/hosts.py, SHARED_ENDPOINTS): crawlers learn to stay away from /s/ (H7)
location = /robots.txt { proxy_pass http://$participant_pool; }
location = /favicon.ico { proxy_pass http://$participant_pool; }
location = / { return 302 https://$researchers_host/; }
location / { return 404; }
