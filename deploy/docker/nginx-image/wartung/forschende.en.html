<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'sha256-aJTxN8if3aQW+/v7r+JoCGWHMlqUapf7weQqZ+qb9jU='; script-src 'sha256-/8mW6Qcv+xMCV+EmM3ZbZkt8h5QItHUWeXT60pyuMWs='; connect-src 'self'; img-src 'none'; base-uri 'none'; form-action 'none'">
<title>__MARKE__ is being updated</title>
<style>
:root{--bg:#f5f6f8;--panel:#fff;--fg:#1c2330;--muted:#5a6372;--accent:#2f5bd3;--line:#dde1e8;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#12161d;--panel:#1a2029;--fg:#e6e9ef;--muted:#9aa3b2;--accent:#86a3f2;--line:#2c3442}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg)}
body{font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;
padding:32px max(16px,env(safe-area-inset-right)) 32px max(16px,env(safe-area-inset-left));min-height:100vh}
main{max-width:34rem;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:36px 32px;
display:flex;flex-direction:column;gap:16px}
h1{font-size:1.55rem;line-height:1.25;margin:0;text-wrap:balance}
p{margin:0}
.leise{color:var(--muted);font-size:.9rem}
.skala{display:flex;gap:10px;margin-bottom:4px}
.skala span{width:16px;height:16px;border-radius:50%;border:2px solid var(--accent)}
@media (prefers-reduced-motion:no-preference){.skala span{animation:kreis 2.5s infinite ease-in-out}
.skala span:nth-child(2){animation-delay:.3s}.skala span:nth-child(3){animation-delay:.6s}
.skala span:nth-child(4){animation-delay:.9s}.skala span:nth-child(5){animation-delay:1.2s}
@keyframes kreis{0%,100%{background:transparent}40%{background:var(--accent)}}}
@media (prefers-reduced-motion:reduce){.skala span:first-child{background:var(--accent)}}
.knoepfe{display:flex;gap:10px;flex-wrap:wrap}
button{font:inherit;font-size:.95rem;font-weight:600;padding:9px 16px;border-radius:8px;border:1px solid var(--accent);
background:transparent;color:var(--accent);cursor:pointer}
button.haupt{background:var(--accent);color:var(--panel)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<main data-selbst="1" data-fragen="Checking …" data-noch="Not ready yet. Checking again shortly." data-gleich="Next try in {s} s" data-wieder="Back again.">
<div class="skala" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
<h1>Sorry, we are tinkering with __MARKE__</h1>
<p>For this update we surveyed ourselves: “How satisfied are you with the waiting time?” We can guess the answer. It usually takes less than two minutes.</p>
<p>Everything up to your last change is saved. This page reloads itself as soon as __MARKE__ answers again.</p>
<p id="wieder" hidden></p>
<div class="knoepfe"><button type="button" id="neu" class="haupt">Reload now</button></div>
<p class="leise" id="stand" role="status" aria-live="polite"></p>
</main>
<script>
(function () {
  var m = document.querySelector("main"), stand = document.getElementById("stand"), wieder = document.getElementById("wieder");
  var alle = 15, rest = alle, da = false;
  function zeigen(text) { stand.textContent = text; }
  function fragen() {
    zeigen(m.getAttribute("data-fragen"));
    fetch("/healthz", { cache: "no-store", credentials: "omit" }).then(function (r) {
      if (!r.ok) { zeigen(m.getAttribute("data-noch")); return; }
      if (m.getAttribute("data-selbst") === "1") { location.reload(); return; }
      da = true; wieder.hidden = false; zeigen(m.getAttribute("data-wieder"));
    }).catch(function () { zeigen(m.getAttribute("data-noch")); });
  }
  setInterval(function () {
    if (da) { return; }
    rest -= 1;
    if (rest <= 0) { rest = alle; fragen(); return; }
    zeigen(m.getAttribute("data-gleich").replace("{s}", String(rest)));
  }, 1000);
  document.getElementById("neu").addEventListener("click", function () { location.reload(); });
  var zurueck = document.getElementById("zurueck");
  if (zurueck) { zurueck.addEventListener("click", function () { history.back(); }); }
})();
</script>
</body>
</html>
