# Own server with Docker (Philipp, 2026-10-08): PostgreSQL, the researchers' side (askurious.de), the participants'
# side (ask.askurious.de) and nginx in front, which sends each host name to its container. 443 is the default,
# 80 only redirects (and answers Let's Encrypt). Secrets live in ~/askurious-env/.env on the server, linked here as
# .env, never in the repository or the code folder (deploy-docker.sh). The app separates the two sides itself
# (app/hosts.py): PARTICIPANT_BASE_URL makes participants' links lead to ask.askurious.de, SIDE lets each container
# answer only its own paths (on askurious.de the participants' paths move to ask.askurious.de). nginx lets only those
# paths through there as well.
name: askurious

# Logs of every container: Docker's json-file, at most 3 files of 20 MB each, then the oldest goes. No access log
# with IP addresses anywhere: gunicorn writes none, nginx none for participants and only failed requests without
# address and query for the rest (nginx/askurious.conf.template; code audit 2026-10-08, B2).
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

# What the app containers read from the .env (audit 2026-10-13, SV-2/DP-6). No container gets the whole .env any
# more (env_file): each gets the lines it needs, by name. A name without a value takes the line of the same name from
# the .env (the file compose reads anyway, a link to ~/askurious-env/.env); a line missing there stays missing in the
# container, so config.py keeps its default. POSTGRES_PASSWORD (the db service only), DB_APP_PASSWORD (in DATABASE_URL),
# BRAND_COMPUTE_SECRET, OFFSITE_* and the other lines for the scripts reach no app container.
# The settings: every name config.py reads, except the ones compose sets itself below and DEV_LOGIN (never on a
# server). A new setting in config.py goes here as well (tests/platform/test_compose_hardening.py says so).
