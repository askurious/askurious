# sshd settings for the Docker server (audit 2026-10-09, BT5). Not deployed by any script: copied by hand to
# /etc/ssh/sshd_config.d/10-askurious.conf (steps in deploy/docker/BETRIEB.md, "SSH absichern"). sshd takes the first
# value it reads, and Ubuntu reads sshd_config.d/*.conf in name order: 10- comes before 50-cloud-init.conf, which
# switches password sign-in on.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
X11Forwarding no
# brute force: OpenSSH 9.8 and later penalise addresses that fail again and again (PerSourcePenalties, on by
# default); OpenSSH 10.2 runs on the server. Written out so that it stays on:
PerSourcePenalties yes
LoginGraceTime 30
# only the accounts that administer the server; add others before you switch this on
#AllowUsers <login>
