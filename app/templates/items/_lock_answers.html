{# Feedback elements: fix the answers they show once seen (app/feedback_lock.py; Philipp and Ralf, 2026-10-11) #}

  <span class="hint">{{ de_en("Die gezeigten Fragen sind fest, sobald die Person diese Rückmeldung gesehen hat, damit sich niemand an die Mehrheit anpasst. Steht die Frage auf derselben Seite, legt die Person ihre Antwort mit „Antwort festlegen“ fest. „Zurück“ zeigt die Antwort dann nur noch an.", "The questions shown are fixed once the person has seen this feedback, so nobody adjusts to the majority. If the question is on the same page, the person fixes the answer with “Antwort festlegen”. “Back” then only shows the answer.") }}</span></label>
{# Feedback elements: count participations still under way, too (app/balance.py; u7pauw, 2026-11-09). Also in a running survey. #}
<input type="hidden" name="count_running_shown" value="1">
<label class="check"><input type="checkbox" name="count_running" value="1" {% if item.config.get("count_running", True) %}checked{% endif %}> {{ de_en("auch laufende Teilnahmen zählen", "also count participations still under way") }}
  <span class="hint">{{ de_en("Standardmäßig an. Ohne Häkchen zählen nur abgeschlossene Teilnahmen. Mit Häkchen zählt jede Teilnahme, die die gezeigte Frage schon beantwortet hat, etwa wenn eine Gruppe gemeinsam an einer Stelle wartet. Die eigene Teilnahme zählt nicht mit; gezeigt wird weiter erst ab 5 Antworten. Die Qualitätsmarkierungen (z. B. zu schnell) greifen nur bei abgeschlossenen Teilnahmen. Lässt sich auch während der Datenerhebung ändern.", "On by default. Without the tick only completed participations count. With the tick every participation that has already answered the question shown counts, for instance when a group waits together at one point. One's own participation does not count; shown still only from 5 answers. Quality flags (e.g. too fast) apply to completed participations only. Can also be changed during data collection.") }}</span></label>
