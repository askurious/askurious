<svg class="ddi-figure" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 880" role="img" aria-label="Structure of the Askurious metadata after DDI Lifecycle 4.0: on the left the study with researchers, institutions, access and other material; on the right the reusable metadata with population, concept, data collection (methodology, sample, instrument, flow, questions, hints for interviewers), data set (variables, calculation, weighting, codes, categories) and data file.">
<title>Structure of the Askurious metadata after DDI Lifecycle 4.0: on the left the study with researchers, institutions, access and other material; on the right the reusable metadata with population, concept, data collection (methodology, sample, instrument, flow, questions, hints for interviewers), data set (variables, calculation, weighting, codes, categories) and data file.</title>
<style>
.ddf-panel{fill:var(--surface,#fff);stroke:var(--border-strong,#cfcdc5)}
.ddf-sub{fill:var(--surface-2,#f8f8f5);stroke:var(--border-strong,#cfcdc5)}
.ddf-box{fill:var(--surface,#fff);stroke:var(--border-strong,#cfcdc5)}
.ddf-head{fill:var(--fg,#1c1c1a);font-size:17px;font-weight:650}
.ddf-brand{fill:var(--fg,#1c1c1a);font-size:22px;font-weight:600;font-family:var(--font-serif,Georgia,serif)}
.ddf-title{fill:var(--fg,#1c1c1a);font-size:13px;font-weight:650}
.ddf-line{fill:var(--muted,#6b6b66);font-size:11.5px}
.ddf-tagbg{fill:var(--accent-soft,rgba(41,87,164,.1))}
.ddf-tag{fill:var(--accent,#2957a4);font-size:11px;font-family:var(--mono,ui-monospace,monospace)}
.ddf-ref,.ddf-has{fill:none;stroke:var(--muted,#6b6b66);stroke-width:1.2}
.ddf-ref{stroke-dasharray:3 3}
.ddf-tip{fill:var(--muted,#6b6b66)}
.ddf-label{fill:var(--muted,#6b6b66);font-size:11px;font-style:italic}
</style>
<defs><marker id="ddf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ddf-tip" d="M0 0L10 5L0 10z"/></marker></defs>
<text class="ddf-brand" x="28" y="40">Askurious metadata</text>
