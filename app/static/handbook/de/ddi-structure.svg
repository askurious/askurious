<svg class="ddi-figure" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 880" role="img" aria-label="Aufbau der Askurious-Metadaten nach DDI Lifecycle 4.0: links die Studie mit Forschenden, Einrichtungen, Zugang und weiterem Material; rechts die wiederverwendbaren Metadaten mit Grundgesamtheit, Konzept, Erhebung (Methodik, Stichprobe, Instrument, Ablauf, Fragen, Hinweise für Interviewende), Datensatz (Variablen, Berechnung, Gewichtung, Codes, Kategorien) und Datei.">
